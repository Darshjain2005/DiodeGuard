version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: diodeguard-postgres
    restart: always
    environment:
      POSTGRES_DB: diodeguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: diodeguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - diodeguard-net

  ml-engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diodeguard-ml-engine
    restart: unless-stopped
    command: python app/main.py
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:diodeguard@postgres:5432/diodeguard
    depends_on:
      - postgres
    networks:
      - diodeguard-net

  gateway:
    build:
      context: ./node_backend
      dockerfile: Dockerfile
    container_name: diodeguard-gateway
    restart: unless-stopped
    command: node server.js
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:diodeguard@postgres:5432/diodeguard
      - ML_ENGINE_URL=http://ml-engine:8000
    depends_on:
      - postgres
      - ml-engine
    networks:
      - diodeguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diodeguard-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_GATEWAY_URL=http://localhost:5000
    depends_on:
      - gateway
    networks:
      - diodeguard-net

networks:
  diodeguard-net:
    driver: bridge

volumes:
  postgres_data:
